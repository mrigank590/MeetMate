services:
  db:
    restart: always
    image: mongo:latest
    container_name: meetmate_database
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - meetmate_network

  web:
    build:
      context: .
    command: >
      bash -c "python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - meetmate_network

networks:
  meetmate_network:

volumes:
  mongodb_data:
